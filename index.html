<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>拼豆色号助手 · 下载</title>
<style>
:root{
  --bg:#0F1923; --panel:#141F2A; --line:#2A3B4D;
  --red:#FF4655; --teal:#00C8C8; --txt:#ECE8E1; --txt2:#8FA3B3;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--txt); font-family:-apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  display:flex; align-items:center; justify-content:center; padding:24px;
  background-image:
    repeating-linear-gradient(45deg, rgba(255,255,255,.012) 0 2px, transparent 2px 8px),
    radial-gradient(900px 500px at 80% -10%, rgba(255,70,85,.10), transparent 60%),
    radial-gradient(700px 500px at 0% 110%, rgba(0,200,200,.07), transparent 60%);
}
.card{
  width:100%; max-width:420px; background:var(--panel); border:1px solid var(--line);
  padding:32px 24px; text-align:center; position:relative; clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);
}
.badge{display:inline-block;font-size:11px;letter-spacing:.2em;color:var(--teal);font-weight:700;margin-bottom:14px}
h1{font-size:24px;letter-spacing:.06em;margin-bottom:8px}
h1 em{color:var(--red);font-style:normal}
.sub{color:var(--txt2);font-size:13px;line-height:1.7;margin-bottom:26px}
.btn{
  display:block; width:100%; padding:15px; margin:10px 0; border:1px solid var(--line);
  background:var(--panel); color:var(--txt); font-size:15px; font-weight:700; letter-spacing:.08em;
  cursor:pointer; text-decoration:none; clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
}
.btn.primary{background:linear-gradient(180deg,#FF7A85,#FF4655 55%,#E8384A);border-color:#FFA3AB;color:#fff;
  box-shadow:0 0 14px rgba(255,70,85,.45)}
.btn.ios{border-color:var(--teal);color:var(--teal)}
.btn:active{filter:brightness(1.1)}
.tip{margin-top:18px;font-size:11px;color:var(--txt2);line-height:1.7}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--red);border-radius:50%;
  animation:sp .8s linear infinite;margin:0 auto 18px}
@keyframes sp{to{transform:rotate(360deg)}}
#auto{display:block;margin-bottom:18px;font-size:12px;color:var(--teal)}
</style>
</head>
<body>
<div class="card">
  <div class="spin" id="spin"></div>
  <div class="badge">PERLER · HELPER</div>
  <h1>拼豆<em>色号助手</em></h1>
  <p class="sub" id="msg">正在识别你的设备…</p>
  <div id="auto"></div>
  <a class="btn primary" id="btnAndroid" href="#" style="display:none">🤖 下载 Android 安装包</a>
  <a class="btn ios" id="btnIphone" href="#" style="display:none">🍎 在浏览器中打开使用</a>
  <a class="btn" id="btnApk" href="#" style="display:none">备用：直接下载 APK</a>
  <p class="tip" id="tip"></p>
</div>

<script>
/* ====== 配置区：把下面两个 URL 换成你的真实地址 ====== */
var CONFIG = {
  apkUrl:   'https://baishihao.github.io/perler-helper/perler-release.apk',   // APK 下载地址
  onlineUrl:'https://baishihao.github.io/perler-helper/online/'              // iPhone 在线版地址（必须 HTTPS）
};
/* ==================================================== */

var ua = navigator.userAgent || '';
var isAndroid = /Android/i.test(ua);
var isiOS = /iPhone|iPad|iPod/i.test(ua);
var inWechat = /MicroMessenger/i.test(ua);

var msg = document.getElementById('msg');
var auto = document.getElementById('auto');
var spin = document.getElementById('spin');
var btnAndroid = document.getElementById('btnAndroid');
var btnIphone = document.getElementById('btnIphone');
var btnApk = document.getElementById('btnApk');
var tip = document.getElementById('tip');

btnAndroid.href = CONFIG.apkUrl;
btnApk.href = CONFIG.apkUrl;
btnIphone.href = CONFIG.onlineUrl;

function done(text){
  msg.textContent = text;
  spin.style.display = 'none';
}

if (isAndroid) {
  btnAndroid.style.display = 'block';
  btnApk.style.display = 'block';
  if (inWechat) {
    done('检测到微信内置浏览器。请点右上角「···」→「在浏览器打开」后再下载。');
    tip.textContent = 'Android 手机：点上方按钮下载 APK 安装使用。';
  } else {
    done('检测到 Android 设备，正在准备下载…');
    auto.textContent = '如未自动开始，请点下方按钮';
    setTimeout(function(){ window.location.href = CONFIG.apkUrl; }, 600);
    tip.textContent = '安装时如提示「未知来源」，请允许本应用安装即可。';
  }
} else if (isiOS) {
  btnIphone.style.display = 'block';
  done('检测到 iPhone / iPad，正在打开…');
  auto.textContent = '如未自动跳转，请点下方按钮';
  setTimeout(function(){ window.location.href = CONFIG.onlineUrl; }, 600);
  tip.textContent = '提示：在 Safari 中点「分享」→「添加到主屏幕」，可像 App 一样全屏使用。';
} else {
  btnAndroid.style.display = 'block';
  btnIphone.style.display = 'block';
  btnApk.style.display = 'block';
  done('请选择你的设备');
  tip.textContent = 'Android 下载 APK 安装；iPhone 直接在浏览器打开使用。';
}
</script>
</body>
</html>
