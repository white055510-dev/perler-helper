<script>
var APK_URLS = ["https://cdn.jsdelivr.net/gh/white055510-dev/perler-helper@main/perler-release.apk","https://white055510-dev.github.io/perler-helper/perler-release.apk"];
var ONLINE_URLS = ["https://white055510-dev.github.io/perler-helper/online/","https://raw.githack.com/white055510-dev/perler-helper/main/online/index.html"];

var ua = navigator.userAgent || '';
var isAndroid = /Android/i.test(ua);
var isiOS = /iPhone|iPad|iPod/i.test(ua);
var isWechat = /MicroMessenger/i.test(ua);

var btnApk = document.getElementById('btnApk');
var btnIos = document.getElementById('btnIos');
var statusEl = document.getElementById('status');

btnApk.href = APK_URLS[0];
btnIos.href = ONLINE_URLS[0];

if (isAndroid) {
  statusEl.textContent = isWechat
    ? '当前在微信内，若无法下载请点右上角「···」→「在浏览器打开」'
    : '';
} else if (isiOS) {
  statusEl.textContent = isWechat
    ? '当前在微信内，建议点右上角「···」→「在 Safari 中打开」'
    : '';
}

/* APK 下载失败时自动切换到下一个镜像 */
btnApk.addEventListener('click', function(e){
  if (APK_URLS.length < 2) return;
  e.preventDefault();
  var i = 0;
  statusEl.textContent = '正在连接下载源…';
  function tryNext() {
    if (i >= APK_URLS.length) {
      statusEl.textContent = '下载源都连不上，请复制链接用浏览器打开：' + APK_URLS[0];
      return;
    }
    var url = APK_URLS[i++];
    var img = new Image();
    var done = false;
    var t = setTimeout(function(){ if(!done){ done=true; tryNext(); } }, 3500);
    img.onload = img.onerror = function(){
      if (done) return;
      done = true; clearTimeout(t);
      statusEl.textContent = '';
      window.location.href = url;
    };
    img.src = url + '?probe=' + Date.now();
  }
  tryNext();
});
</script>
